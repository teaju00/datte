<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>다 때가 있다</title>
<meta name="description" content="각리중학교 일정과 업무 마감을 한 달력에서 봅니다.">
<meta name="theme-color" content="#1f6b4a">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="다 때가 있다">
<style>
  /* 앱(구글 앱스 스크립트 웹앱)을 화면 가득 띄우기만 한다.
     구글 계정이 여럿 로그인된 브라우저에서 앱 주소를 바로 열면 「현재 파일을 열 수 없습니다」가 나와서
     이 페이지 안에 넣어 연다. 앱 쪽은 setXFrameOptionsMode(ALLOWALL)로 이것을 허락한다. */
  html, body { margin: 0; height: 100%; background: #f4f7f5; }
  iframe { display: block; width: 100%; height: 100%; height: 100dvh; border: 0; }
  @media (prefers-color-scheme: dark) { html, body { background: #18201c; } }
</style>
</head>
<body>
<iframe id="app" title="다 때가 있다" allow="clipboard-write"
  src="https://script.google.com/macros/s/AKfycbxRb_Ifq2XP2AZRFcZ_mWlEkuWrsUFz9DvwzCbm6SOai2hApDQC03Kco1UJMLPhBV3psg/exec"></iframe>
<script>
  // 이 페이지 주소에 붙은 값(?dept=2학년부 등)을 앱 주소로 넘긴다 — 부서 바로가기 주소도 이 페이지로 쓸 수 있다
  (function () {
    var q = location.search;
    if (q && q.length > 1) {
      var f = document.getElementById('app');
      f.src = f.src.split('?')[0] + q;
    }
  })();
</script>
</body>
</html>
